<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leonard Wright — A Private Celebration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy-deep: #08101f;
    --navy: #0d1d38;
    --navy-glow: #1a3a6b;
    --gold: #e0b872;
    --gold-bright: #f4e4c1;
    --text: #f5f0e8;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--navy-deep);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
  }

  section {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: 3rem 1.6rem;
  }

  .bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
  }

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* ---------- SLIDE 1: searchlight opener ---------- */
  #s1 {
    background:
      radial-gradient(ellipse 80% 55% at 50% 12%, rgba(60,110,190,0.38), transparent 60%),
      linear-gradient(to bottom, #0d1d38 0%, #08101f 70%);
  }

  /* Sweeping searchlight beams */
  .beams { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .beam {
    position: absolute;
    top: -20%;
    left: 50%;
    width: 42vw;
    height: 150vh;
    background: linear-gradient(to bottom, rgba(190,215,255,0.16), rgba(190,215,255,0) 65%);
    transform-origin: top center;
    filter: blur(6px);
    mix-blend-mode: screen;
  }
  .beam.b1 { animation: sweepL 7s ease-in-out infinite alternate; }
  .beam.b2 { animation: sweepR 8s ease-in-out infinite alternate; opacity: 0.75; }
  .beam.b3 { animation: sweepC 9s ease-in-out infinite alternate; opacity: 0.5; width: 30vw; }

  @keyframes sweepL { from { transform: rotate(-26deg);} to { transform: rotate(-6deg);} }
  @keyframes sweepR { from { transform: rotate(24deg);} to { transform: rotate(6deg);} }
  @keyframes sweepC { from { transform: rotate(-8deg);} to { transform: rotate(10deg);} }

  .glow-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 32%;
    background: linear-gradient(to top, rgba(40,80,150,0.5), transparent);
    z-index: 0;
  }

  .content { position: relative; z-index: 3; max-width: 680px; }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(0.7rem, 1.5vw, 0.82rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(224,184,114,0.9);
    margin-bottom: 1.6rem;
  }

  .name-bold {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: clamp(3.4rem, 13vw, 7rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }

  .name-script {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(3.2rem, 12vw, 6.4rem);
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 2px 30px rgba(224,184,114,0.35);
    margin-top: -0.1em;
  }

  .kicker {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.95rem, 2.2vw, 1.2rem);
    letter-spacing: 0.04em;
    color: rgba(245,240,232,0.82);
    margin-top: 1.8rem;
  }

  /* ---------- SLIDE 2 & 3 shared ---------- */
  .statement {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 5rem);
    line-height: 1.0;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 3px 30px rgba(0,0,0,0.6);
  }

  .statement .accent {
    display: block;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(2.8rem, 10vw, 5.4rem);
    text-transform: none;
    color: var(--gold);
    letter-spacing: 0;
    margin-top: 0.05em;
  }

  .line {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.98rem, 2.3vw, 1.25rem);
    letter-spacing: 0.03em;
    color: rgba(245,240,232,0.88);
    margin-top: 1.5rem;
    max-width: 30ch;
  }

  #s2 .scrim {
    background: linear-gradient(to bottom, rgba(8,16,31,0.55), rgba(8,16,31,0.35) 45%, rgba(8,16,31,0.8));
  }

  #s3 .scrim {
    background: linear-gradient(to bottom, rgba(8,16,31,0.5), rgba(8,16,31,0.4) 40%, rgba(8,16,31,0.82));
  }

  /* ---------- Details block on slide 3 ---------- */
  .venue {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    letter-spacing: 0.01em;
    color: var(--text);
    margin-bottom: 0.2rem;
  }

  .divider {
    width: 46px; height: 1px;
    background: rgba(224,184,114,0.6);
    margin: 1.2rem auto;
  }

  .details {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.9rem, 1.9vw, 1.05rem);
    line-height: 1.9;
    letter-spacing: 0.05em;
    color: rgba(245,240,232,0.9);
  }

  .details strong {
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.06em;
  }

  .logo-wrap { margin-top: 2.4rem; opacity: 0.8; }
  .logo-wrap svg { height: 24px; width: auto; }

  /* ---------- scroll reveal ---------- */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .beam { animation: none; }
    .reveal { transition: opacity 0.4s ease; transform: none; }
  }
</style>
</head>
<body>

  <!-- SLIDE 1 — Searchlight opener, name on front -->
  <section id="s1">
    <div class="beams">
      <div class="beam b1"></div>
      <div class="beam b2"></div>
      <div class="beam b3"></div>
    </div>
    <div class="glow-floor"></div>
    <div class="content reveal in">
      <div class="eyebrow">A Private Celebration</div>
      <div class="name-bold">Leonard</div>
      <div class="name-script">Wright</div>
      <div class="kicker">Thirty-three years. Built from nothing.</div>
    </div>
  </section>

  <!-- SLIDE 2 — Atlanta hero -->
  <section id="s2">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="atlanta-hero.mp4" type="video/mp4" />
    </video>
    <div class="scrim"></div>
    <div class="content reveal">
      <div class="statement">The Empire Is<span class="accent">Sold.</span></div>
      <div class="line">Now we celebrate the man who built it.</div>
    </div>
  </section>

  <!-- SLIDE 3 — Champagne pour + details -->
  <section id="s3">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="champagne-pour.mp4" type="video/mp4" />
    </video>
    <div class="scrim"></div>
    <div class="content reveal">
      <div class="venue">Summerour Studio</div>
      <div class="divider"></div>
      <div class="details">
        409 Bishop Street NW<br>
        Atlanta, Georgia 30318<br><br>
        <strong>August 21, 2026 &nbsp;·&nbsp; 6:00 PM</strong><br>
        Attire: Dress to Impress
      </div>
      <div class="logo-wrap">
        <svg width="158" height="28" viewBox="0 0 158 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="INPAX">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M34.654 26.7491V0.276344H29.7731V26.7491H34.654ZM60.1394 16.6894L47.3595 0.276344H43.3727V26.7491H48.2909V8.89889L62.0024 26.7869V26.7491H65.0576V0.238525H60.1394V16.6894ZM78.2102 5.00362H85.5875C91.8471 5.00362 91.8843 14.3825 85.5875 14.3825H78.2102V5.00362ZM85.5875 0.238525C81.489 0.238525 77.3904 0.276344 73.2919 0.276344V26.7491H78.2102V18.9585H85.5875C98.3674 18.9585 98.3302 0.238525 85.5875 0.238525ZM122.921 26.7491H128.287L116.587 0.276344H111.222L99.5225 26.7491H104.851L107.086 21.7571H120.723L122.921 26.7491ZM118.748 17.1054H109.061L113.905 5.83562L118.748 17.1054ZM145.016 10.1469L138.496 0.276344H133.093V0.503253L141.886 13.3614L132.832 26.5978V26.7491H138.347L145.016 16.8029L151.685 26.7491H157.2V26.5978L148.109 13.3614L156.939 0.503253V0.276344H151.536L145.016 10.1469Z" fill="#f5f0e8"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H5.73013L15.0367 13.5952L5.73013 27.1904H0L9.45683 13.584L0 0Z" fill="#FB8500"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7.72415 0H13.4543L22.7609 13.5952L13.4543 27.1904H7.72415L17.181 13.584L7.72415 0Z" fill="#FB8500"/>
        </svg>
      </div>
    </div>
  </section>

  <script>
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.3 });
    document.querySelectorAll('.reveal').forEach(r => io.observe(r));
  </script>
</body>
</html>
