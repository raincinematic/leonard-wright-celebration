<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leonard Wright — A Private Celebration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Pinyon+Script&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy-deep: #08101f;
    --navy: #0d1d38;
    --gold: #e0b872;
    --gold-bright: #f4e4c1;
    --text: #f5f0e8;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--navy-deep);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
  }

  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* ---- background layers, one per beat ---- */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    opacity: 0; transition: opacity 1s ease;
  }
  .bg.active { opacity: 1; }

  /* Beat 1 bg: navy + searchlights */
  #bg1 {
    background:
      radial-gradient(ellipse 60% 40% at 30% 0%, rgba(150,190,255,0.5), transparent 55%),
      radial-gradient(ellipse 60% 40% at 70% 0%, rgba(150,190,255,0.5), transparent 55%),
      radial-gradient(ellipse 80% 55% at 50% 8%, rgba(70,120,200,0.42), transparent 60%),
      linear-gradient(to bottom, #12244a 0%, #0d1d38 40%, #08101f 78%);
  }
  .beams { position: absolute; inset: 0; overflow: hidden; }
  .beam {
    position: absolute; top: -25%; left: 50%;
    width: 30vw; height: 150vh;
    background: linear-gradient(to bottom,
      rgba(220,235,255,0.62) 0%,
      rgba(200,222,255,0.34) 30%,
      rgba(190,215,255,0) 68%);
    transform-origin: top center; filter: blur(3px); mix-blend-mode: screen;
  }
  .beam.b1 { animation: sweepL 7s ease-in-out infinite alternate; }
  .beam.b2 { animation: sweepR 8s ease-in-out infinite alternate; opacity: 0.85; }
  .beam.b3 { animation: sweepC 9s ease-in-out infinite alternate; opacity: 0.6; width: 22vw; }
  @keyframes sweepL { from{transform:rotate(-26deg);} to{transform:rotate(-6deg);} }
  @keyframes sweepR { from{transform:rotate(24deg);} to{transform:rotate(6deg);} }
  @keyframes sweepC { from{transform:rotate(-8deg);} to{transform:rotate(10deg);} }

  .bg video { width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .bg .scrim { position: absolute; inset: 0; }
  #bg2 .scrim { background: linear-gradient(to bottom, rgba(8,16,31,0.55), rgba(8,16,31,0.35) 45%, rgba(8,16,31,0.82)); }
  #bg3 .scrim { background: linear-gradient(to bottom, rgba(8,16,31,0.5), rgba(8,16,31,0.4) 40%, rgba(8,16,31,0.84)); }

  /* ---- text beats ---- */
  .beat {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 2rem 1.6rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .beat.active { opacity: 1; }

  .eyebrow {
    font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: clamp(0.7rem, 1.5vw, 0.82rem);
    letter-spacing: 0.42em; text-transform: uppercase;
    color: rgba(224,184,114,0.9); margin-bottom: 1.5rem;
  }

  .name-bold {
    font-family: 'Cormorant', Georgia, serif; font-weight: 600;
    font-size: clamp(3.2rem, 12vw, 6.4rem); line-height: 0.98;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text); text-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }
  .name-script {
    font-family: 'Pinyon Script', cursive; font-weight: 400;
    font-size: clamp(4rem, 15vw, 8rem); line-height: 1.05;
    color: var(--gold); text-shadow: 0 2px 30px rgba(224,184,114,0.4);
    margin-top: 0.05em;
  }
  .kicker {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: clamp(0.95rem, 2.2vw, 1.2rem);
    letter-spacing: 0.04em; color: rgba(245,240,232,0.82);
    margin-top: 1.7rem;
  }

  .statement {
    font-family: 'Cormorant', Georgia, serif; font-weight: 500;
    font-size: clamp(2.6rem, 9vw, 4.8rem); line-height: 1.05;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text); text-shadow: 0 3px 30px rgba(0,0,0,0.6);
  }
  .statement .accent {
    display: block; white-space: nowrap; font-family: 'Pinyon Script', cursive;
    font-weight: 400; font-size: clamp(3.6rem, 13vw, 6.8rem);
    text-transform: none; color: var(--gold);
    letter-spacing: 0; margin-top: 0.1em;
    white-space: nowrap;
  }
  .line {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: clamp(0.98rem, 2.3vw, 1.25rem);
    letter-spacing: 0.03em; color: rgba(245,240,232,0.88);
    margin-top: 1.4rem; max-width: 34ch; text-wrap: balance;
  }

  .venue {
    font-family: 'Pinyon Script', cursive; font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 4rem);
    letter-spacing: 0.01em; color: var(--gold);
    text-shadow: 0 2px 26px rgba(224,184,114,0.4);
    margin-bottom: 0.3rem;
  }
  .invite-lead {
    font-family: 'Cormorant', Georgia, serif; font-weight: 400;
    font-style: italic; font-size: clamp(0.95rem, 2.4vw, 1.2rem);
    letter-spacing: 0.08em; color: rgba(245,240,232,0.72);
    text-transform: uppercase; margin-bottom: 0.9rem;
  }
  .divider { width: 46px; height: 1px; background: rgba(224,184,114,0.6); margin: 1.1rem auto; }
  .details {
    font-family: 'Cormorant', Georgia, serif; font-weight: 500;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem); line-height: 1.85;
    letter-spacing: 0.06em; color: rgba(245,240,232,0.92);
  }
  .details strong { font-weight: 600; color: var(--gold); letter-spacing: 0.08em; }
  .details .small {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: clamp(0.82rem, 1.8vw, 0.95rem);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(245,240,232,0.72);
  }
  .logo-wrap { margin-top: 2.2rem; opacity: 0.8; }
  .logo-wrap svg { height: 24px; width: auto; }

  /* subtle static settle on beat text (fade only, no drift) */
  .beat.active .settle {
    animation: settle 1.1s ease both;
  }
  @keyframes settle { from { opacity: 0; } to { opacity: 1; } }

  .progress {
    position: absolute; bottom: 0; left: 0; height: 2px;
    background: rgba(224,184,114,0.85); width: 0%; z-index: 20;
  }
  .replay {
    position: absolute; bottom: 1.5rem; right: 1.5rem; z-index: 30;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.9); font-family: 'Inter', sans-serif;
    font-size: 0.66rem; font-weight: 400; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 0.5rem 1rem; border-radius: 100px;
    cursor: pointer; backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.5s ease;
  }
  .replay.show { opacity: 0.8; }
  .replay:hover { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { .beam { animation: none; } }
</style>
</head>
<body>
  <div class="stage">

    <!-- backgrounds -->
    <div class="bg active" id="bg1">
      <div class="beams">
        <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
      </div>
    </div>
    <div class="bg" id="bg2">
      <video muted loop playsinline preload="auto"><source src="atlanta-hero.mp4" type="video/mp4" /></video>
      <div class="scrim"></div>
    </div>
    <div class="bg" id="bg3">
      <video muted loop playsinline preload="auto"><source src="champagne-elegant.mp4" type="video/mp4" /></video>
      <div class="scrim"></div>
    </div>

    <!-- beat 1 -->
    <div class="beat active" id="beat1">
      <div class="settle">
        <div class="eyebrow">A Private Celebration</div>
        <div class="name-bold">Leonard</div>
        <div class="name-script">Wright</div>
        <div class="kicker">Thirty-three years. Built from nothing.</div>
      </div>
    </div>

    <!-- beat 2 -->
    <div class="beat" id="beat2">
      <div class="settle">
        <div class="statement">The Empire Is<span class="accent">Sold.</span></div>
        <div class="line">Now we celebrate the man who&nbsp;built&nbsp;it.</div>
      </div>
    </div>

    <!-- beat 3 -->
    <div class="beat" id="beat3">
      <div class="settle">
        <div class="invite-lead">You're Invited</div>
        <div class="venue">Summerour Studio</div>
        <div class="divider"></div>
        <div class="details">
          409 Bishop Street NW<br>
          Atlanta, Georgia 30318<br><br>
          <strong>August 21, 2026&nbsp; &middot; &nbsp;6:00 PM</strong><br>
          <span class="small">Attire: Cocktail</span>
        </div>
        <div class="logo-wrap">
          <svg width="158" height="28" viewBox="0 0 158 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="INPAX">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M34.654 26.7491V0.276344H29.7731V26.7491H34.654ZM60.1394 16.6894L47.3595 0.276344H43.3727V26.7491H48.2909V8.89889L62.0024 26.7869V26.7491H65.0576V0.238525H60.1394V16.6894ZM78.2102 5.00362H85.5875C91.8471 5.00362 91.8843 14.3825 85.5875 14.3825H78.2102V5.00362ZM85.5875 0.238525C81.489 0.238525 77.3904 0.276344 73.2919 0.276344V26.7491H78.2102V18.9585H85.5875C98.3674 18.9585 98.3302 0.238525 85.5875 0.238525ZM122.921 26.7491H128.287L116.587 0.276344H111.222L99.5225 26.7491H104.851L107.086 21.7571H120.723L122.921 26.7491ZM118.748 17.1054H109.061L113.905 5.83562L118.748 17.1054ZM145.016 10.1469L138.496 0.276344H133.093V0.503253L141.886 13.3614L132.832 26.5978V26.7491H138.347L145.016 16.8029L151.685 26.7491H157.2V26.5978L148.109 13.3614L156.939 0.503253V0.276344H151.536L145.016 10.1469Z" fill="#f5f0e8"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H5.73013L15.0367 13.5952L5.73013 27.1904H0L9.45683 13.584L0 0Z" fill="#FB8500"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M7.72415 0H13.4543L22.7609 13.5952L13.4543 27.1904H7.72415L17.181 13.584L7.72415 0Z" fill="#FB8500"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="progress" id="progress"></div>
    <button class="replay" id="replay">Replay</button>
  </div>

  <script>
    const beats = ['beat1','beat2','beat3'].map(id => document.getElementById(id));
    const bgs   = ['bg1','bg2','bg3'].map(id => document.getElementById(id));
    const vid2 = document.querySelector('#bg2 video');
    const vid3 = document.querySelector('#bg3 video');
    const progress = document.getElementById('progress');
    const replay = document.getElementById('replay');

    // timing: three beats, ~15s total, holds on last
    const HOLDS = [4500, 4500, 6000];       // ms each beat is shown
    const TOTAL = HOLDS.reduce((a,b)=>a+b,0);

    let timers = [];
    function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }

    function show(i){
      beats.forEach((b,j)=>b.classList.toggle('active', j===i));
      bgs.forEach((b,j)=>b.classList.toggle('active', j===i));
      if(i===1){ try{vid2.currentTime=0;vid2.play();}catch(e){} }
      if(i===2){ try{vid3.currentTime=0;vid3.play();}catch(e){} }
    }

    function run(){
      clearTimers();
      replay.classList.remove('show');
      progress.style.transition = 'none';
      progress.style.width = '0%';
      show(0);
      // progress bar animates across full duration
      requestAnimationFrame(()=>{
        progress.style.transition = 'width ' + TOTAL + 'ms linear';
        progress.style.width = '100%';
      });
      // advance beats
      let t = 0;
      timers.push(setTimeout(()=>show(1), t += HOLDS[0]));
      timers.push(setTimeout(()=>show(2), t += HOLDS[1]));
      timers.push(setTimeout(()=>{ replay.classList.add('show'); }, TOTAL)); // hold on beat 3, show replay
    }

    replay.addEventListener('click', run);
    run();
  </script>
</body>
</html>
